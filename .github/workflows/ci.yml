name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      # Dependabot's runs get no Actions secrets, and a dependency bump changes no lines to cover.
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/compiler/coverage/lcov.info,packages/schemas/coverage/lcov.info,apps/builder/coverage/lcov.info
          fail_ci_if_error: true

  schemas-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run schemas
      - run: npm run spec-schema
      - name: Fail if the committed schemas differ from a fresh extraction
        run: git diff --exit-code packages/schemas/plugin-schemas.json packages/compiler/spec-schema.json

  codemeta-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run codemeta
      - name: Fail if codemeta.json is behind the version or the jsPsych it builds for
        run: git diff --exit-code codemeta.json

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
